<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SCP Terminal">
  <!-- Campbell black base, soft white glyphs (no pure #000 / #fff) -->
  <rect width="32" height="32" rx="6" fill="#0c0c0c"/>
  <!-- prompt chevron -->
  <path
    d="M8 10.5 L14.5 16 L8 21.5"
    fill="none"
    stroke="#f2f2f2"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- command underscore -->
  <path
    d="M16.5 21.5 H24.5"
    fill="none"
    stroke="#f2f2f2"
    stroke-width="2.4"
    stroke-linecap="round"
  />
</svg>
